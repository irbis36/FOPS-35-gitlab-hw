global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

#---------------------------------------------------------------------
# Statistics page
#---------------------------------------------------------------------
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node

#---------------------------------------------------------------------
# Task 1: L4 Round-robin балансировка
#---------------------------------------------------------------------
frontend tcp_front
    bind *:80
    mode tcp
    default_backend tcp_servers

backend tcp_servers
    mode tcp
    balance roundrobin
    server server1 server1:8080 check
    server server2 server2:8081 check
