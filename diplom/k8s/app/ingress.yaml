apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: diplom-app
  namespace: diplom
spec:
  ingressClassName: nginx
  rules:
    # Хост не указываем, чтобы приложение отвечало по IP на 80 порту
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: diplom-app
                port:
                  number: 80
