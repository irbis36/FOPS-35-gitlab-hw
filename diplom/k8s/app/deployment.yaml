apiVersion: apps/v1
kind: Deployment
metadata:
  name: diplom-app
  namespace: diplom
  labels:
    app: diplom-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: diplom-app
  template:
    metadata:
      labels:
        app: diplom-app
    spec:
      # Секрет для доступа к приватному реестру
      imagePullSecrets:
        - name: registry-creds
      containers:
        - name: nginx
          image: cr.yandex/crp1oavjn6oftmsg31lk/diplom-app:v0.1.0
          ports:
            - containerPort: 80
          # Ресурсы ограничены, потому что ноды слабые
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
